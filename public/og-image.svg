<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#090d16;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f1d38"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Accent Tag Gradient -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>

  <!-- Subtle IDE Grid lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
  </g>

  <!-- Outer Card Frame -->
  <rect x="80" y="80" width="1040" height="470" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Titlebar Window Dots -->
  <circle cx="115" cy="115" r="7" fill="#ef4444"/>
  <circle cx="135" cy="115" r="7" fill="#f59e0b"/>
  <circle cx="155" cy="115" r="7" fill="#10b981"/>
  <text x="180" y="120" fill="#64748b" font-size="14" font-family="monospace">vatsalchandrani-portfolio — bash — 80x24</text>

  <!-- Left Content Column -->
  <!-- Status Badge -->
  <rect x="115" y="160" width="190" height="30" rx="15" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="132" cy="175" r="4" fill="#22c55e"/>
  <text x="145" y="180" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">OPEN TO WORK</text>

  <!-- Name -->
  <text x="115" y="255" fill="url(#textGrad)" font-size="56" font-weight="800" letter-spacing="-1">Vatsal Chandrani</text>

  <!-- Subtitle / Role -->
  <text x="115" y="300" fill="#94a3b8" font-size="24" font-weight="600">Creator &amp; Problem Solver · <tspan fill="#38bdf8" font-weight="700">Founder of CollegeBook</tspan></text>

  <!-- University / Education -->
  <text x="115" y="340" fill="#cbd5e1" font-size="18" font-weight="500">🎓 B.Tech IT · <tspan fill="#ffffff" font-weight="700">Dharmsinh Desai University (DDU)</tspan> · Nadiad, Gujarat</text>

  <!-- Key Projects Badges -->
  <g transform="translate(115, 385)">
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="14" y="22" fill="#f1f5f9" font-size="14" font-weight="600">🏫 CampusConnect</text>

    <rect x="165" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="179" y="22" fill="#38bdf8" font-size="14" font-weight="700">📚 CollegeBook</text>

    <rect x="315" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="329" y="22" fill="#f1f5f9" font-size="14" font-weight="600">🌐 CampusGrid</text>

    <rect x="460" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="474" y="22" fill="#f1f5f9" font-size="14" font-weight="600">📈 Risk Early Warning</text>

    <rect x="655" y="0" width="105" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="669" y="22" fill="#f1f5f9" font-size="14" font-weight="600">🔨 BidVault</text>
  </g>

  <!-- Bottom Competitive Programming & Tech Stack Stats Bar -->
  <g transform="translate(115, 455)">
    <rect x="0" y="0" width="970" height="65" rx="12" fill="#090d16" fill-opacity="0.9" stroke="#1e293b" stroke-width="1"/>

    <!-- Stat 1 -->
    <text x="30" y="27" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">PROBLEMS SOLVED</text>
    <text x="30" y="52" fill="#22c55e" font-size="20" font-weight="800" font-family="monospace">950+</text>

    <line x1="190" y1="15" x2="190" y2="50" stroke="#1e293b"/>

    <!-- Stat 2 -->
    <text x="215" y="27" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">CODEFORCES</text>
    <text x="215" y="52" fill="#38bdf8" font-size="20" font-weight="800" font-family="monospace">1271 (Pupil)</text>

    <line x1="390" y1="15" x2="390" y2="50" stroke="#1e293b"/>

    <!-- Stat 3 -->
    <text x="415" y="27" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">LEETCODE</text>
    <text x="415" y="52" fill="#fbbf24" font-size="20" font-weight="800" font-family="monospace">1651 Rating</text>

    <line x1="575" y1="15" x2="575" y2="50" stroke="#1e293b"/>

    <!-- Stat 4 -->
    <text x="600" y="27" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">CORE STACK</text>
    <text x="600" y="52" fill="#cbd5e1" font-size="15" font-weight="700">Spring Boot · PostgreSQL · Redis · React</text>
  </g>
</svg>
